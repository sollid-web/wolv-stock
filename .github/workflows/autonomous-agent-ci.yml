name: Autonomous agent runtime CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [autonomy/onchain-agent-runtime]

permissions:
  contents: read

jobs:
  contracts-and-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile and test Solidity policy validators
        run: |
          forge build
          forge test -vv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer
      - name: Static security analysis
        run: slither . --fail-high
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Agent runtime logic tests
        run: npm run test:logic
      - name: Lint
        run: npm run lint
