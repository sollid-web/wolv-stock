name: price-snapshot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run logger once
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
        run: |
          # keep tracking the same tickers as the existing data
          export TICKERS=$(tail -n 16 data/snapshots.jsonl | grep -o '"tk":"[^"]*"' | cut -d'"' -f4 | sort -u | paste -sd, -)
          echo "tracking: $TICKERS"
          node scripts/logger.mjs --once
      - name: Commit data
        run: |
          git config user.name "wolv-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots.jsonl
          git diff --cached --quiet || (git commit -m "chore: price snapshot [skip ci]" && git pull --rebase && git push)
